<!DOCTYPE html>
<html>
<head>
  <title>Select TH</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Select Town Hall</h2>
<div id="thButtons"></div>

<script>
let type = localStorage.getItem("type");
let container = document.getElementById("thButtons");

for(let i=6;i<=18;i++){
  let btn = document.createElement("button");
  btn.innerText = "TH " + i;
  btn.className = type;

  btn.onclick = ()=>{
    localStorage.setItem("th", i);
    window.location.href="base.html";
  };

  container.appendChild(btn);
}
</script>

</body>
</html>
