<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Select Town Hall</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100vh; min-height: 100dvh;
      background: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1920') center/cover no-repeat fixed;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      position: relative; padding: 80px 16px 40px;
    }
    body::before { content: ''; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 0; }
    .back { position: fixed; top: 16px; left: 16px; z-index: 2; color: #fff; text-decoration: none; font-size: 1rem; background: rgba(255,255,255,0.1); padding: 10px 16px; border-radius: 10px; }
    .back:active { background: rgba(255,255,255,0.2); }
    h1 { position: relative; z-index: 1; color: #fff; font-size: clamp(1.3rem, 5vw, 2.5rem); margin-bottom: 8px; text-align: center; font-weight: 800; }
    .subtitle { position: relative; z-index: 1; color: #888; margin-bottom: 30px; font-size: 0.95rem; text-align: center; }
    .th-grid { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 500px; }
    .th-btn {
      padding: 18px 8px; border: none; border-radius: 12px; font-size: clamp(0.9rem, 3.5vw, 1.2rem);
      font-weight: 700; color: #fff; cursor: pointer; transition: all 0.2s ease;
      touch-action: manipulation; -webkit-appearance: none;
    }
    .th-btn:active { transform: scale(0.95); filter: brightness(1.3); }
    .color-war { background: linear-gradient(135deg, #8B0000, #DC143C); box-shadow: 0 3px 15px rgba(220,20,60,0.4); }
    .color-rank { background: linear-gradient(135deg, #00008B, #4169E1); box-shadow: 0 3px 15px rgba(65,105,225,0.4); }
    .color-farm { background: linear-gradient(135deg, #006400, #32CD32); box-shadow: 0 3px 15px rgba(50,205,50,0.4); }
    .color-cwl { background: linear-gradient(135deg, #4B0082, #8A2BE2); box-shadow: 0 3px 15px rgba(138,43,226,0.4); }
    @media (min-width: 640px) {
      .th-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; max-width: 700px; }
      .th-btn { padding: 25px 15px; font-size: 1.3rem; }
      .th-btn:hover { transform: scale(1.08); }
    }
  </style>
</head>
<body>
  <a href="index.html" class="back">← Back</a>
  <h1 id="pageTitle">Select TH</h1>
  <p class="subtitle" id="subtitle">Choose Town Hall level</p>
  <div class="th-grid" id="thGrid"></div>
  <script>
    const type = localStorage.getItem('selectedType') || 'war';
    const typeNames = { war: 'War', rank: 'Ranked', farm: 'Farming', cwl: 'CWL' };
    const colorClass = 'color-' + type;
    document.getElementById('pageTitle').textContent = typeNames[type] + ' Base';
    document.getElementById('subtitle').textContent = 'Select your Town Hall';
    const grid = document.getElementById('thGrid');
    for (let i = 6; i <= 18; i++) {
      const btn = document.createElement('button');
      btn.className = 'th-btn ' + colorClass;
      btn.textContent = 'TH' + i;
      btn.onclick = () => { localStorage.setItem('selectedTH', i); window.location.href = 'base.html'; };
      grid.appendChild(btn);
    }
  </script>
</body>
</html>
