<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CoC Base Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100vh; min-height: 100dvh;
      background: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1920') center/cover no-repeat fixed;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      position: relative; padding: 20px;
    }
    body::before { content: ''; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 0; }
    h1 { position: relative; z-index: 1; color: #fff; font-size: clamp(1.5rem, 6vw, 3rem); margin-bottom: 40px; text-align: center; text-shadow: 0 0 20px rgba(255,255,255,0.3); font-weight: 800; }
    .btn-grid { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr; gap: 16px; width: 100%; max-width: 400px; }
    .btn {
      padding: 24px 20px; border: none; border-radius: 16px; font-size: clamp(1.1rem, 4vw, 1.4rem);
      font-weight: 700; color: #fff; cursor: pointer; transition: all 0.25s ease;
      text-transform: uppercase; letter-spacing: 1px; position: relative; overflow: hidden;
      touch-action: manipulation; -webkit-appearance: none;
    }
    .btn:active { transform: scale(0.96); }
    .btn-war { background: linear-gradient(135deg, #8B0000, #DC143C); box-shadow: 0 4px 20px rgba(220,20,60,0.4); }
    .btn-rank { background: linear-gradient(135deg, #00008B, #4169E1); box-shadow: 0 4px 20px rgba(65,105,225,0.4); }
    .btn-farm { background: linear-gradient(135deg, #006400, #32CD32); box-shadow: 0 4px 20px rgba(50,205,50,0.4); }
    .btn-cwl { background: linear-gradient(135deg, #4B0082, #8A2BE2); box-shadow: 0 4px 20px rgba(138,43,226,0.4); }
    .btn-war:active { box-shadow: 0 0 30px rgba(220,20,60,0.6); }
    .btn-rank:active { box-shadow: 0 0 30px rgba(65,105,225,0.6); }
    .btn-farm:active { box-shadow: 0 0 30px rgba(50,205,50,0.6); }
    .btn-cwl:active { box-shadow: 0 0 30px rgba(138,43,226,0.6); }
    .admin-link { position: fixed; bottom: 20px; right: 20px; z-index: 1; color: #666; text-decoration: none; font-size: 0.85rem; padding: 10px; }
    .admin-link:active { color: #fff; }
    @media (min-width: 640px) {
      .btn-grid { grid-template-columns: repeat(2, 1fr); max-width: 600px; gap: 24px; }
      .btn { padding: 40px 30px; font-size: 1.5rem; }
      .btn:hover { transform: scale(1.05); filter: brightness(1.2); }
    }
  </style>
</head>
<body>
  <h1>⚔️ CoC Base Hub</h1>
  <div class="btn-grid">
    <button class="btn btn-war" onclick="selectType('war')">🔴 War Base</button>
    <button class="btn btn-rank" onclick="selectType('rank')">🔵 Ranked Base</button>
    <button class="btn btn-farm" onclick="selectType('farm')">🟢 Farming Base</button>
    <button class="btn btn-cwl" onclick="selectType('cwl')">🟣 CWL Base</button>
  </div>
  <a href="admin.html" class="admin-link">⚙️ Admin</a>
  <script>
    function selectType(type) {
      localStorage.setItem('selectedType', type);
      window.location.href = 'th.html';
    }
  </script>
</body>
</html>
